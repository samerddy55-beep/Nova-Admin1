<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر Pro - أحدث المنتجات</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <div class="logo">\uD83D\uDED2 <span>متجر</span> Pro</div>
    <div class="search-box">
      <input id="search" placeholder="ابحث عن منتج..."/>
      <span>\uD83D\uDD0D</span>
    </div>
    <div class="nav-actions">
      <button id="cartBtn" class="cart-btn">السلة <b id="cartCount">0</b> \uD83E\uDDFA</button>
      <button class="login-btn">تسجيل دخول</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>تشكيلة <span>الصيف</span> وصلت</h1>
    <p>أكثر من 1000 منتج بخصم حتى 50% - شحن مجاني داخل الرياض</p>
    <div class="hero-stats">
      <div><b>4.9/5</b><small>تقييم العملاء</small></div>
      <div><b>+12k</b><small>طلب مكتمل</small></div>
      <div><b>24h</b><small>توصيل سريع</small></div>
    </div>
  </div>
  <div class="hero-visual">
    <div class="hero-card">
      <div class="badge">خصم 40%</div>
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="product"/>
      <h3>ساعة ذكية Pro Max</h3>
      <div class="price"><span>899 ر.س</span><s>1499 ر.س</s></div>
    </div>
  </div>
</section>

<div class="filters">
  <button class="filter active" data-cat="all">الكل</button>
  <button class="filter" data-cat="tech">تقنية</button>
  <button class="filter" data-cat="fashion">أزياء</button>
  <button class="filter" data-cat="home">منزل</button>
</div>

<main class="grid" id="productsGrid"></main>

<div id="cartDrawer" class="cart-drawer">
  <div class="drawer-head">
    <h3>سلة التسوق</h3>
    <button id="closeCart">✕</button>
  </div>
  <div id="cartItems" class="drawer-body"></div>

function renderProducts(){
  const filtered = products.filter(p=>{
    const okCat = activeCat==='all' || p.cat===activeCat;
    const okQ = p.title.includes(query) || query==='';
    return okCat && okQ;
  });
  grid.innerHTML = filtered.map(p=>\`

      <img src="\${p.img}" loading="lazy"/>
      <div class="card-body">

function addToCart(id){

}

}
function removeItem(id){ cart = cart.filter(c=>c.id!==id); persist(); }

`,"my-project/backend/main.py":`from fastapi import FastAPI, Depends, HTTPException
from fastapi.middleware.cors import CORSMiddleware
from sqlalchemy.orm import Session
from .database import get_db, engine
from . import models
from .auth import get_current_user, create_access_token
from pydantic import BaseModel
from typing import List, Optional
import os

models.Base.metadata.create_all(bind=engine)

app = FastAPI(title="Ecommerce API - Coder Pro Max", version="2.0.0")

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

# --- Schemas ---
class ProductCreate(BaseModel):
    title: str
    price: float
    category: str
    image: str
    rating: float = 4.5

class OrderCreate(BaseModel):
    items: List[dict] # [{product_id, qty}]
    address: str
    payment_method: str = "mada"

# --- Routes ---
@app.get("/")
def root():
    return {"message": "Ecommerce API - Coder Pro Max \uD83D\uDD25", "status": "online", "docs": "/docs"}

@app.get("/api/products")
def list_products(q: Optional[str]=None, category: Optional[str]=None, db: Session=Depends(get_db)):
    query = db.query(models.Product)
    if q:
        query = query.filter(models.Product.title.contains(q))
    if category and category != "all":
        query = query.filter(models.Product.category == category)
    return query.all()

@app.get("/api/products/{product_id}")
def get_product(product_id: int, db: Session=Depends(get_db)):
    prod = db.query(models.Product).filter(models.Product.id==product_id).first()
    if not prod:
        raise HTTPException(404, "Product not found")
    return prod

@app.post("/api/products", dependencies=[Depends(get_current_user)])
def create_product(payload: ProductCreate, db: Session=Depends(get_db)):
    prod = models.Product(**payload.dict())
    db.add(prod); db.commit(); db.refresh(prod)
    return prod

@app.post("/api/orders")
def create_order(payload: OrderCreate, user=Depends(get_current_user), db: Session=Depends(get_db)):
    total = 0
    for item in payload.items:
        prod = db.query(models.Product).filter(models.Product.id==item['product_id']).first()
        if not prod:
            raise HTTPException(404, f"Product {item['product_id']} not found")
        total += prod.price * item['qty']
    order = models.Order(
        user_id=user.id,
        total=total,
        address=payload.address,
        status="pending"
    )
    db.add(order); db.commit(); db.refresh(order)
    return {"order_id": order.id, "total": total, "status": "pending"}

@app.post("/api/auth/login")
def login(email: str, password: str, db: Session=Depends(get_db)):
    user = db.query(models.User).filter(models.User.email==email).first()
    if not user or not user.verify_password(password):
        raise HTTPException(401, "Invalid credentials")
    token = create_access_token({"sub": str(user.id)})
    return {"access_token": token, "token_type": "bearer", "user": {"id": user.id, "email": user.email}}

@app.post("/api/auth/register")
def register(email: str, password: str, name: str, db: Session=Depends(get_db)):
    if db.query(models.User).filter(models.User.email==email).first():
        raise HTTPException(400, "Email already registered")
    user = models.User(email=email, name=name)
    user.set_password(password)
    db.add(user); db.commit()
    return {"message": "User created", "id": user.id}

if __name__ == "__main__":
    import uvicorn
    uvicorn.run("backend.main:app", host="0.0.0.0", port=8000, reload=True)

from sqlalchemy.orm import relationship
from sqlalchemy.ext.declarative import declarative_base
from passlib.context import CryptContext
from datetime import datetime

Base = declarative_base()
pwd_context = CryptContext(schemes=["bcrypt"], deprecated="auto")

class User(Base):
    __tablename__ = "users"
    id = Column(Integer, primary_key=True, index=True)
    name = Column(String(100), nullable=False)
    email = Column(String(100), unique=True, index=True, nullable=False)
    hashed_password = Column(String(255), nullable=False)
    is_admin = Column(Boolean, default=False)
    created_at = Column(DateTime, default=datetime.utcnow)
    
    orders = relationship("Order", back_populates="user")
    
    def set_password(self, password: str):
        self.hashed_password = pwd_context.hash(password)
    
    def verify_password(self, password: str) -> bool:
        return pwd_context.verify(password, self.hashed_password)

class Product(Base):
    __tablename__ = "products"
    id = Column(Integer, primary_key=True, index=True)
    title = Column(String(200), nullable=False, index=True)
    price = Column(Float, nullable=False)
    category = Column(String(50), index=True)
    image = Column(Text)
    rating = Column(Float, default=4.5)
    stock = Column(Integer, default=100)
    description = Column(Text, default="")
    created_at = Column(DateTime, default=datetime.utcnow)

class Order(Base):
    __tablename__ = "orders"
    id = Column(Integer, primary_key=True, index=True)
    user_id = Column(Integer, ForeignKey("users.id"))
    total = Column(Float, nullable=False)
    address = Column(Text)
    status = Column(String(20), default="pending") # pending, paid, shipped
    created_at = Column(DateTime, default=datetime.utcnow)
    
    user = relationship("User", back_populates="orders")

class OrderItem(Base):

    product_id = Column(Integer, ForeignKey("products.id"))
    qty = Column(Integer, default=1)
    price_at_time = Column(Float)
    
    order = relationship("Order", back_populates="items")

from jose import JWTError, jwt
from fastapi import Depends, HTTPException
from fastapi.security import HTTPBearer, HTTPAuthorizationCredentials
from sqlalchemy.orm import Session
from .database import get_db
from . import models
import os

SECRET_KEY = os.getenv("SECRET_KEY", "pro-max-super-secret-key-2024-change-in-prod")
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = 60 * 24 * 7 # 7 days

security = HTTPBearer()

def create_access_token(data: dict):
    to_encode = data.copy()
    expire = datetime.utcnow() + timedelta(minutes=ACCESS_TOKEN_EXPIRE_MINUTES)
    to_encode.update({"exp": expire})
    return jwt.encode(to_encode, SECRET_KEY, algorithm=ALGORITHM)

def get_current_user(credentials: HTTPAuthorizationCredentials = Depends(security), db: Session = Depends(get_db)):
    token = credentials.credentials
    try:
        payload = jwt.decode(token, SECRET_KEY, algorithms=[ALGORITHM])
        user_id: str = payload.get("sub")
        if user_id is None:
            raise HTTPException(status_code=401, detail="Invalid token")
    except JWTError:
        raise HTTPException(status_code=401, detail="Invalid token")
    user = db.query(models.User).filter(models.User.id == int(user_id)).first()
    if not user:
        raise HTTPException(status_code=401, detail="User not found")
    return user

def require_admin(user = Depends(get_current_user)):
    if not user.is_admin:
        raise HTTPException(status_code=403, detail="Admin only")
    return user

from sqlalchemy.orm import sessionmaker
import os

DATABASE_URL = os.getenv("DATABASE_URL", "sqlite:///./ecommerce.db")
# For Postgres: postgresql://user:pass@localhost/dbname

engine = create_engine(
    DATABASE_URL,
    connect_args={"check_same_thread": False} if "sqlite" in DATABASE_URL else {}
)

SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)

def get_db():
    db = SessionLocal()
    try:
        yield db
    finally:
        db.close()

# Seed initial products for demo
def seed_products():
    from .models import Product
    db = SessionLocal()
    if db.query(Product).count() == 0:
        sample = [
            {"title": "ساعة ذكية Ultra", "price": 899, "category": "tech", "image": "watch.jpg", "rating": 4.8},
            {"title": "سماعة Pro", "price": 749, "category": "tech", "image": "airpods.jpg", "rating": 4.9},
        ]
        for s in sample:
            db.add(Product(**s))
        db.commit()
    db.close()

 });

from pydantic import BaseModel
from typing import List
from .database import get_db
from .models import Task

app = FastAPI(title="Todo API")

class TaskIn(BaseModel):
    title: str
    status: str = "todo"
    priority: str = "medium"

@app.get("/api/tasks")
def list_tasks(db=Depends(get_db)):
    return db.query(Task).all()

@app.post("/api/tasks")
def create_task(payload: TaskIn, db=Depends(get_db)):
    t = Task(**payload.dict())
    db.add(t); db.commit(); db.refresh(t)
    return t

@app.patch("/api/tasks/{id}")
def update_task(id: int, status: str, db=Depends(get_db)):
    t = db.query(Task).filter(Task.id==id).first()
    t.status = status; db.commit(); return t

@app.delete("/api/tasks/{id}")
def delete_task(id: int, db=Depends(get_db)):
    db.query(Task).filter(Task.id==id).delete(); db.commit()
    return {"ok": True}
